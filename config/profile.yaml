personal_info:
  name: "Yusei Su"
  name_zh: "蘇祐生"
  current_title: "Operations Export & Express 專員"
  current_company: "DPD Taiwan (Linehaul Express Taiwan Ltd.)"
  location: "桃園市"
  years_of_experience: 10

